what_it_tests: >-
  Three dates, none of them a deadline. The benefit starts on one, ends on another, and the letter
  is dated a third time, so a reading that promotes the start date to a deadline puts an alarm in a
  visitor's calendar for the day their money arrives. The monthly amount is not asserted as a total:
  it is what the visitor receives, and the schema has no separate home for that.
