what_it_tests: >-
  The largest number on the page is not the bill. A property valuation of EUR 312.000,00 sits above
  three charges totalling EUR 1.025,10, and a reading that reports the valuation as the amount due
  hands a visitor a figure three hundred times too big. The line amounts are deliberately not
  asserted: the valuation has a label and no other field to sit in, so a careful reading may put it
  beside the charges without being wrong.
