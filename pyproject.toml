[project]
name = "plainletter"
version = "0.1.0"
description = "An agent that reads official letters for the people who help newcomers understand them"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
  "strands-agents>=1.52.0,<2",
  "strands-agents-tools>=0.8.6,<1",
  "bedrock-agentcore>=1.22.0,<2",
  "aws-opentelemetry-distro>=0.19,<1",
  "boto3>=1.43",
  "botocore[crt]>=1.43",
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "pyyaml>=6",
  "icalendar>=6",
  "python-dateutil>=2.9",
  "pypdfium2>=5",
  "pillow>=11",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "hypothesis>=6",
  "ruff>=0.12",
  "mypy>=1.14",
  "bandit>=1.8",
  "pip-audit>=2.8",
  "types-PyYAML",
  "types-python-dateutil",
  "httpx>=0.28",
  "pytest-cov>=7.1",
]

[project.scripts]
plainletter = "plainletter.cli:main"
plainletter-serve = "plainletter.app:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plainletter"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C90", "S", "N", "SIM", "RUF"]
ignore = ["RUF012"]
# The Turkish dotless i and the Cyrillic Ze are letters of two visitor languages, not typos for
# the Latin i and the digit 3, and the month tables and the test fixtures spell words with them.
allowed-confusables = ["ı", "İ", "З"]

[tool.ruff.lint.isort]
# `evals` is a package in this repository, not something installed from an index, so it is grouped
# with the product's own imports rather than with pydantic and pytest.
known-first-party = ["plainletter", "scripts", "evals"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
# `evals` is not shipped, but it is the instrument the prompts are measured with, so a wrong type in
# it is a wrong measurement. It is held to the same bar as the code it measures.
files = ["src", "evals"]
# The agentcore staging tree is generated by `agentcore package` and vendors its dependencies,
# including a typing_extensions.py that shadows the real module when mypy crawls the repo root.
# Tests are excluded on the same reasoning bandit and ruff already apply: strictness is scoped
# to the code that ships, and the suite is exercised by running it.
exclude = ['^agentcore/plainletter/', '^tests/']

[[tool.mypy.overrides]]
module = ["strands.*", "strands_tools.*", "bedrock_agentcore.*", "icalendar.*"]
ignore_missing_imports = true
follow_untyped_imports = true

# pypdfium2 ships no py.typed marker, so following it turns every PDFium call into an untyped call
# in a strict context. Treating the module as opaque keeps the strictness where our own code is.
# boto3 and botocore are the same case, and their stub packages are large enough that pulling them
# in for two calls would cost more than it checks.
[[tool.mypy.overrides]]
module = ["pypdfium2.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The repo root, so the build scripts under scripts/ are importable by the tests that guard their
# output. Without it a run through the console script passes while `python -m pytest` does not.
pythonpath = ["."]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "web", "node_modules"]
