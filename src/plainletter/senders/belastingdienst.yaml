id: belastingdienst
name_nl: Belastingdienst
short_name: Belastingdienst
verified: true
checked_on: "2026-08-21"
what_they_do_en: >-
  The Dutch tax administration. It sends assessments for income tax and other taxes, and decisions
  about amounts to pay or to receive back.
letter_types:
  - aanslag
  - voorlopige aanslag
  - navordering
  - beschikking
consequences:
  - text_nl: >-
      Betaalt u een aanslag niet op tijd, dan volgt een aanmaning en kunnen er invorderingsrente en
      kosten bij komen. Bezwaar maken schort de betaling niet automatisch op; vraag apart uitstel
      van betaling aan.
    text_en: >-
      An unpaid assessment leads to a reminder, and interest and costs can be added. Objecting does
      not by itself postpone payment, so a postponement has to be asked for separately.
    source: https://www.belastingdienst.nl/wps/wcm/connect/nl/home/home
    checked_on: "2026-08-21"
