explanations:
  - language: nl
    what_is_this: >-
      UWV vindt dat u te veel WW heeft gekregen en wil dat geld terug. Van EUR 1.842,60 is al
      EUR 240,00 ingehouden, dus er staat nog EUR 1.602,60 open.
    by_when: Betaal of bel voor 28 augustus 2026.
    if_you_do_nothing: >-
      UWV houdt het bedrag in op een volgende uitkering of geeft de vordering aan een deurwaarder.
      Er kan ook een boete bij komen.
  - language: pl
    what_is_this: >-
      UWV uważa, że wypłacił zbyt wysokie świadczenie WW i żąda zwrotu nadpłaty. Z kwoty
      EUR 1.842,60 potrącono już EUR 240,00, więc pozostaje do zapłaty EUR 1.602,60.
    by_when: Proszę zapłacić albo zadzwonić przed 28 augustus 2026.
    if_you_do_nothing: >-
      UWV potrąci tę kwotę z kolejnego zasiłku albo przekaże sprawę komornikowi. Może dojść też
      kara pieniężna.
steps:
  - order: 1
    dutch: >-
      Bel UWV voor 28 augustus 2026 en zeg dat u de brief heeft gekregen, ook als u niet kunt
      betalen. Een gesprek stopt de verrekening niet, maar het legt uw situatie vast.
    visitor: >-
      Proszę zadzwonić do UWV przed 28 augustus 2026 i powiedzieć, że list został odebrany, nawet
      jeśli nie ma możliwości zapłaty. Rozmowa nie wstrzymuje potrącenia, ale pozwala odnotować
      sytuację.
    official_route: https://www.uwv.nl/particulieren/
  - order: 2
    dutch: >-
      Vraag een betalingsregeling aan als EUR 1.602,60 in een keer niet kan.
    visitor: >-
      Proszę wystąpić o rozłożenie kwoty EUR 1.602,60 na raty, jeśli nie można jej zapłacić
      jednorazowo.
    official_route: https://www.uwv.nl/particulieren/
  - order: 3
    dutch: >-
      Ga met deze brief naar Het Juridisch Loket voordat de zes weken voorbij zijn. Een
      terugvordering kan om redenen worden aangevochten die niet in de brief staan.
    visitor: >-
      Proszę udać się z tym listem do Het Juridisch Loket, zanim minie sześć tygodni. Żądanie
      zwrotu można zakwestionować także z powodów, których nie wskazano w liście.
    official_route: https://www.juridischloket.nl/
draft:
  kind: objection
  addressed_to: UWV
  send_before: null
  dutch: |-
    Geachte heer, mevrouw,

    Ik maak bezwaar tegen de beslissing met kenmerk WW 8830 4471. Ik heb mijn werk en mijn inkomen
    steeds doorgegeven en begrijp niet waarop de terugvordering berust. Ik verzoek u de berekening
    toe te sturen en de beslissing opnieuw te bekijken.

    Met vriendelijke groet,
  visitor: |-
    Szanowni Państwo,

    Wnoszę sprzeciw wobec decyzji o numerze WW 8830 4471. Informacje o mojej pracy i dochodach
    były przeze mnie na bieżąco zgłaszane i nie rozumiem, na czym opiera się żądanie zwrotu.
    Proszę o przesłanie wyliczenia i o ponowne rozpatrzenie decyzji.

    Z poważaniem,
