explanations:
  - language: nl
    what_is_this: >-
      De definitieve belastingaanslag over 2025. De Belastingdienst heeft uw aangifte afgerond en
      berekend dat u nog EUR 1.316,00 moet betalen. Daarin zit EUR 32,00 rente.
    by_when: Betaal voor 30 september 2026.
    if_you_do_nothing: >-
      U krijgt een aanmaning met extra kosten. Daarna mag de ontvanger het bedrag innen bij uw
      werkgever of uw bank.
  - language: uk
    what_is_this: >-
      Остаточне податкове нарахування за 2025 рік. Belastingdienst завершила розгляд вашої
      податкової декларації та розрахувала, що ви маєте доплатити EUR 1.316,00. У цю суму входить
      EUR 32,00 відсотків.
    by_when: Сплатіть до 30 september 2026.
    if_you_do_nothing: >-
      Вам буде надіслано вимогу про сплату з додатковими витратами. Після цього гроші можуть
      стягнути з вашої зарплати або з банківського рахунку.
steps:
  - order: 1
    dutch: Betaal EUR 1.316,00 met aanslagnummer 7423 61 902 H 56.
    visitor: >-
      Сплатіть EUR 1.316,00, вказавши номер податкового нарахування 7423 61 902 H 56.
    official_route: https://www.belastingdienst.nl/wps/wcm/connect/nl/home/home
  - order: 2
    dutch: >-
      Kunt u dit niet in een keer betalen? Vraag een betalingsregeling aan voordat de datum
      voorbij is.
    visitor: >-
      Не можете сплатити одразу? Попросіть про розстрочку до настання цієї дати.
    official_route: https://www.belastingdienst.nl/wps/wcm/connect/nl/home/home
  - order: 3
    dutch: >-
      Klopt de aanslag niet? Maak binnen zes weken na de dagtekening bezwaar en vraag apart uitstel
      van betaling, want bezwaar stopt de betaling niet.
    visitor: >-
      Чи є помилка в податковому нарахуванні? Подайте заперечення протягом шести тижнів від дати
      листа й окремо попросіть відстрочку платежу, оскільки подання заперечення саме по собі не
      зупиняє оплату.
    official_route: https://www.juridischloket.nl/
draft:
  kind: objection
  addressed_to: Belastingdienst
  send_before: null
  dutch: |-
    Geachte heer, mevrouw,

    Ik maak bezwaar tegen de definitieve aanslag inkomstenbelasting 2025 met aanslagnummer
    7423 61 902 H 56. Mijn inkomen over dat jaar was lager dan in de aanslag staat. Ik verzoek u de
    aanslag opnieuw te bekijken en vraag daarnaast uitstel van betaling.

    Met vriendelijke groet,
  visitor: |-
    Шановні пані та панове,

    Я подаю заперечення проти остаточного нарахування податку на доходи за 2025 рік, номер
    7423 61 902 H 56. Мій дохід за той рік був нижчим, ніж зазначено в податковому нарахуванні.
    Прошу повторно розглянути нарахування і водночас надати відстрочку платежу.

    З повагою,
