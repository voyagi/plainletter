    visitor: >-
      EUR 374,82 tutarının hesabınıza geçtiğini kontrol edin. Gelmezse 6512 3387 müşteri numarası
      ile SVB'yi arayın.
    official_route: https://www.svb.nl/nl/
  - order: 2
    dutch: >-
      Is uw kind gaan werken, verhuisd, of het huis uit? Geef dat door voor 11 september 2026.
    visitor: >-
      Çocuğunuz çalışmaya mı başladı, taşındı mı, ya da evden mi ayrıldı? Bunu 11 september 2026
      tarihinden önce bildirin.
    official_route: https://www.svb.nl/nl/
  - order: 3
    dutch: >-
      Klopt het bedrag volgens u niet? U kunt binnen zes weken bezwaar maken. Het Juridisch Loket
      helpt daar gratis bij.
    visitor: >-
      Tutarın doğru olmadığını düşünüyorsanız altı hafta içinde itiraz edebilirsiniz. Het
      Juridisch Loket bu konuda ücretsiz yardım eder.
    official_route: https://www.juridischloket.nl/
