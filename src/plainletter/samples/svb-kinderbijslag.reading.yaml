explanations:
  - language: nl
    what_is_this: >-
      Goed nieuws in een officiele envelop. De SVB betaalt kinderbijslag: EUR 299,86 voor dit
      kwartaal en EUR 74,96 die nog openstond, samen EUR 374,82. U hoeft niets te betalen.
    by_when: >-
      Geef veranderingen in uw gezin door voor 11 september 2026.
    if_you_do_nothing: >-
      Het geld komt gewoon binnen. Verandert er iets in uw gezin en zegt u het te laat, dan vraagt
      de SVB het te veel betaalde terug en kan er een boete bij komen.
  - language: tr
    what_is_this: >-
      Resmî bir zarfın içinde iyi haber. SVB çocuk parası ödüyor: bu çeyrek için EUR 299,86 ve
      daha önce ödenmemiş EUR 74,96, toplam EUR 374,82. Ödemeniz gereken bir şey yok.
    by_when: >-
      Ailenizdeki değişiklikleri 11 september 2026 tarihinden önce bildirin.
    if_you_do_nothing: >-
      Para hesabınıza yatar. Ailenizde bir şey değişir ve bunu geç bildirirseniz, SVB fazla ödenen
      tutarı geri ister ve ceza eklenebilir.
steps:
  - order: 1
    dutch: >-
      Controleer of het bedrag EUR 374,82 op uw rekening komt. Komt het niet, bel dan de SVB met
