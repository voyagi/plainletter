  dutch: |-
    Geachte heer, mevrouw,

    Ik geef een wijziging door bij klantnummer 6512 3387. Mijn oudste kind is gaan werken naast de
    school. Ik hoor graag of dit gevolgen heeft voor de kinderbijslag.

    Met vriendelijke groet,
  visitor: |-
    با سلام و احترام،

    تغییری را برای شماره مشتری 6512 3387 اعلام می‌کنم. فرزند بزرگم در کنار مدرسه شروع به کار کرده
    است. لطفاً بفرمایید آیا این موضوع بر کمک‌هزینه فرزند اثر می‌گذارد.

    با احترام،
