explanations:
  - language: nl
    what_is_this: >-
      Een verkeersboete van het CJIB. U reed 14 km/u te hard op de Boezemweg in Rotterdam. U moet
      EUR 174,00 betalen.
    by_when: Betaal voor 15 september 2026.
    if_you_do_nothing: >-
      Het bedrag wordt verhoogd met 50 procent. Betaalt u daarna nog niet, dan komt er nog 100
      procent bij.
  - language: uk
    what_is_this: >-
      Штраф за перевищення швидкості від CJIB. Ви їхали на 14 km/u швидше за дозволене на вулиці
      Boezemweg у Роттердамі. Потрібно сплатити EUR 174,00.
    by_when: Сплатіть до 15 september 2026.
    if_you_do_nothing: >-
      Сума зросте на 50 відсотків. Якщо ви не сплатите й після цього, додасться ще 100 відсотків.
steps:
  - order: 1
    dutch: Betaal EUR 174,00 met beschikkingsnummer 8194 5523 7761.
    visitor: Сплатіть EUR 174,00, вказавши номер 8194 5523 7761.
    official_route: https://www.cjib.nl/verkeersboete
  - order: 2
    dutch: Kunt u het niet in een keer betalen? Vraag een betalingsregeling aan.
    visitor: Не можете сплатити одразу? Попросіть про розстрочку.
    official_route: https://www.cjib.nl/betalingsregeling
  - order: 3
    dutch: >-
      Bent u het er niet mee eens? Stel beroep in bij de officier van justitie, binnen zes weken na
      de datum van de beschikking.
    visitor: >-
      Не згодні? Подайте заперечення прокурору протягом шести тижнів від дати рішення.
    official_route: https://www.om.nl/onderwerpen/verkeer
draft:
  kind: objection
  addressed_to: Officier van justitie
  send_before: null
  dutch: |-
    Geachte officier van justitie,

    Ik maak bezwaar tegen beschikking 8194 5523 7761. Mijn auto stond die dag niet op de Boezemweg.
    Ik verzoek u de sanctie in te trekken.

    Met vriendelijke groet,
  visitor: |-
    Шановний пане прокуроре,

    Подаю заперечення проти рішення 8194 5523 7761. Мого автомобіля того дня не було на вулиці
    Boezemweg. Прошу скасувати штраф.

    З повагою,
