explanations:
  - language: nl
    what_is_this: >-
      Een verkeersboete van het CJIB. U reed 14 km/u te hard op de Boezemweg in Rotterdam. U moet
      EUR 174,00 betalen.
    by_when: Betaal voor 15 september 2026.
    if_you_do_nothing: >-
      Het bedrag wordt verhoogd met 50 procent. Betaalt u daarna nog niet, dan komt er nog 100
      procent bij.
  - language: ar
    what_is_this: >-
      غرامة مرور من CJIB. تجاوزت السرعة في شارع Boezemweg في روتردام. عليك دفع EUR 174,00.
    by_when: ادفع قبل 15 september 2026.
    if_you_do_nothing: >-
      يزيد المبلغ 50 بالمئة. وإذا لم تدفع بعد ذلك يزيد 100 بالمئة أخرى.
