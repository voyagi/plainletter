explanations:
  - language: nl
    what_is_this: >-
      Een deurwaarder int een bedrag waarover de rechter al heeft beslist: EUR 612,40 plus
      EUR 188,95 aan rente en kosten, samen EUR 801,35. Dit is geen eerste rekening, dit is het
      einde van een zaak die al gelopen heeft.
    by_when: >-
      De datum in de brief was 14 augustus 2026 en die is voorbij. Bel vandaag nog.
    if_you_do_nothing: >-
      De deurwaarder legt beslag op uw loon, uw uitkering of uw bankrekening, en de kosten daarvan
      komen er bovenop.
  - language: pl
    what_is_this: >-
      Komornik ściąga kwotę, o której sąd już zdecydował: EUR 612,40 plus EUR 188,95 odsetek i
      kosztów, razem EUR 801,35. To nie jest pierwszy rachunek, to koniec sprawy, która została
      już rozstrzygnięta.
    by_when: >-
      Data podana w liście to 14 augustus 2026 i już minęła. Proszę zadzwonić jeszcze dzisiaj.
    if_you_do_nothing: >-
      Komornik zajmie wynagrodzenie, zasiłek albo konto bankowe, a koszty zajęcia dojdą do kwoty.
steps:
  - order: 1
    dutch: >-
      Bel vandaag het kantoor met dossiernummer 26 44 7180 en zeg dat u een regeling wilt. Zolang
      er nog geen beslag ligt, kan dat volgens deze brief.
    visitor: >-
      Proszę zadzwonić dzisiaj do kancelarii, podać numer sprawy 26 44 7180 i poprosić
      o rozłożenie należności na raty. Zgodnie z tym listem jest to możliwe, dopóki nie doszło do
      zajęcia.
    official_route: https://www.juridischloket.nl/
  - order: 2
    dutch: >-
      Ga vandaag of morgen naar Het Juridisch Loket, 0800 8020, en neem deze brief mee. Bij een
      deurwaarder tellen dagen.
    visitor: >-
      Proszę dziś albo jutro udać się do Het Juridisch Loket, 0800 8020, i zabrać ze sobą ten
      list. W sprawach z komornikiem liczy się każdy dzień.
    official_route: https://www.juridischloket.nl/
  - order: 3
    dutch: >-
      Meld u bij de schuldhulpverlening van uw gemeente. Dat is gratis en het kan een beslag nog
      afwenden.
    visitor: >-
      Proszę zgłosić się do gminnego doradcy do spraw długów. To bezpłatne i może jeszcze
      zatrzymać zajęcie.
    official_route: https://www.juridischloket.nl/
