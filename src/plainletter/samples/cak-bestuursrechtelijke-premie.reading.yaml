  dutch: |-
    Geachte heer, mevrouw,

    Ik reageer op de aanmelding met zaaknummer CAK 3390 7742. Ik heb met mijn zorgverzekeraar een
    betalingsregeling afgesproken en houd mij daaraan. Ik verzoek u de aanmelding te beeindigen en
    stuur het bewijs van de regeling mee.

    Met vriendelijke groet,
  visitor: |-
    Szanowni Państwo,

    Odpowiadam na zgłoszenie o numerze sprawy CAK 3390 7742. Uzgodniłem z moim ubezpieczycielem
    zdrowotnym spłatę w ratach i wywiązuję się z niej. Proszę o zakończenie zgłoszenia, w
    załączeniu przesyłam potwierdzenie umowy.

    Z poważaniem,
