explanations:
  - language: nl
    what_is_this: >-
      Uw zorgverzekeraar heeft de onbetaalde premie doorgegeven aan het CAK. Vanaf nu wordt
      EUR 187,50 per maand van uw inkomen ingehouden in plaats van de gewone EUR 149,35. Dit is
      geen boete en geen schuld die hiermee wordt afbetaald.
    by_when: Reageer voor 17 september 2026.
    if_you_do_nothing: >-
      Uw werkgever of uitkeringsinstantie houdt het hogere bedrag in op uw inkomen. De oude
      achterstand bij de verzekeraar blijft er los van staan en wordt hier niet kleiner van.
  - language: pl
    what_is_this: >-
      Ubezpieczyciel zdrowotny zgłosił Pana do CAK, ponieważ składki długo nie były płacone. Od
      teraz z dochodu potrącane jest EUR 187,50 miesięcznie zamiast zwykłych EUR 149,35. To nie
      jest kara i stary dług nie zostaje przez to spłacony.
    by_when: Odpowiedz przed 17 september 2026.
    if_you_do_nothing: >-
      Pracodawca albo instytucja wypłacająca świadczenie potrąci wyższą kwotę z Pana dochodu. Dług
      u ubezpieczyciela zostaje osobno i przez to nie maleje.
steps:
  - order: 1
    dutch: >-
      Heeft u al een betalingsregeling met uw zorgverzekeraar? Meld dat bij het CAK met
      zaaknummer CAK 3390 7742, dan stopt de aanmelding volgens deze brief.
    visitor: >-
      Czy ma Pan już rozłożenie długu na raty u ubezpieczyciela? Proszę zgłosić to do CAK, podając
      numer sprawy CAK 3390 7742. Według tego listu zgłoszenie wtedy się kończy.
    official_route: https://www.rijksoverheid.nl/onderwerpen/schulden
  - order: 2
    dutch: >-
      Heeft u die regeling nog niet? Bel dan eerst uw zorgverzekeraar en maak er een, en ga
      daarna naar de schuldhulpverlening van uw gemeente.
    visitor: >-
      Jeszcze nie ma Pan takiej umowy? Proszę najpierw zadzwonić do ubezpieczyciela i ją ustalić,
      a potem pójść do gminnego doradcy do spraw długów.
    official_route: https://www.rijksoverheid.nl/onderwerpen/schulden
  - order: 3
    dutch: >-
      Ga met deze brief naar Het Juridisch Loket voor 17 september 2026. Een aanmelding kan
      worden aangevochten en dat is te ingewikkeld om alleen te doen.
    visitor: >-
      Proszę zanieść ten list do Het Juridisch Loket przed 17 september 2026. Zgłoszenie można
      podważyć, a to zbyt skomplikowane, by robić to samemu.
    official_route: https://www.juridischloket.nl/
draft:
